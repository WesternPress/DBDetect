# Conda environment for DBDetect: diabetic retinopathy detection on ODIR-5K (CSCE566 final project, Problem 1).
# Versions are the ones the code was developed and tested with (Nov 2026, CUDA 12.4 wheels).
#
#   conda env create -f environment.yml
#   conda activate dbdetect
name: dbdetect
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - timm==1.0.24
      - huggingface_hub==0.33.2
      - safetensors==0.5.3
      - numpy==1.26.4
      - pandas==1.5.3
      - scikit-learn==1.7.0
      - pyyaml==6.0
variables:
  # Keep packages installed in ~/.local from shadowing the versions pinned above.
  PYTHONNOUSERSITE: "1"
